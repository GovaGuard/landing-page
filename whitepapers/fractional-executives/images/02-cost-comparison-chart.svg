<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C55"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33E5FF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00D9FF" stroke-width="0.3" opacity="0.03"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00D9FF" stroke-width="0.3" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#scanlines)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">COST ANALYSIS</text>
  <text x="400" y="65" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">Total Cost Comparison — 24 Months</text>

  <!-- Chart area -->
  <g transform="translate(100, 90)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="310" stroke="#808080" stroke-width="0.5" opacity="0.4"/>
    <!-- Y-axis labels and grid lines -->
    <text x="-10" y="5" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#808080">$500K</text>
    <line x1="0" y1="0" x2="600" y2="0" stroke="#808080" stroke-width="0.3" opacity="0.15"/>

    <text x="-10" y="83" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#808080">$375K</text>
    <line x1="0" y1="78" x2="600" y2="78" stroke="#808080" stroke-width="0.3" opacity="0.15"/>

    <text x="-10" y="160" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#808080">$250K</text>
    <line x1="0" y1="155" x2="600" y2="155" stroke="#808080" stroke-width="0.3" opacity="0.15"/>

    <text x="-10" y="238" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#808080">$125K</text>
    <line x1="0" y1="233" x2="600" y2="233" stroke="#808080" stroke-width="0.3" opacity="0.15"/>

    <text x="-10" y="315" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#808080">$0</text>
    <line x1="0" y1="310" x2="600" y2="310" stroke="#808080" stroke-width="0.5" opacity="0.4"/>

    <!-- Full-Time Bar -->
    <rect x="100" y="8" width="120" height="302" rx="3" fill="url(#orangeBar)" filter="url(#glowOrange)" opacity="0.9"/>
    <rect x="100" y="8" width="120" height="302" rx="3" fill="none" stroke="#FF8C55" stroke-width="1" opacity="0.6"/>
    <!-- Dollar amount above bar -->
    <text x="160" y="-8" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#FF6B35" filter="url(#glowOrange)">$486,000</text>

    <!-- Fractional Bar -->
    <rect x="380" y="233" width="120" height="77" rx="3" fill="url(#cyanBar)" filter="url(#glowCyan)" opacity="0.9"/>
    <rect x="380" y="233" width="120" height="77" rx="3" fill="none" stroke="#33E5FF" stroke-width="1" opacity="0.6"/>
    <!-- Dollar amount above bar -->
    <text x="440" y="220" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00D9FF" filter="url(#glowCyan)">$120,000</text>

    <!-- X-axis labels -->
    <text x="160" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E0E0E0">Full-Time</text>
    <text x="160" y="356" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E0E0E0">CTO + CISO</text>
    <text x="440" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E0E0E0">Fractional</text>
    <text x="440" y="356" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E0E0E0">CTO + CISO</text>

    <!-- Savings callout -->
    <g transform="translate(260, 100)">
      <!-- Arrow from full-time to fractional -->
      <path d="M-30,50 Q40,80 30,150" stroke="#00FF88" stroke-width="2" fill="none" stroke-dasharray="6,3" opacity="0.6"/>
      <polygon points="28,145 35,155 22,152" fill="#00FF88" opacity="0.6"/>

      <!-- Savings badge -->
      <rect x="-55" y="-20" width="110" height="58" rx="6" fill="#000000" fill-opacity="0.7" stroke="#00FF88" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00FF88" filter="url(#glowGreen)">75%</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#00FF88" letter-spacing="2">SAVINGS</text>
    </g>
  </g>

  <!-- Y-axis title -->
  <text x="30" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1" transform="rotate(-90, 30, 260)">TOTAL COST (24 MONTHS)</text>

  <!-- Bottom info bar -->
  <rect x="0" y="472" width="800" height="28" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1">SAVINGS: $366,000 OVER 24 MONTHS · INCLUDES SALARY, BENEFITS, RECRUITING, OVERHEAD</text>
</svg>
