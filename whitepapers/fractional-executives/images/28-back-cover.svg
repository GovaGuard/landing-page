<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A1628"/><stop offset="100%" stop-color="#000"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.05"/></pattern>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,2 55,15 55,37 30,50 5,37 5,15" fill="none" stroke="#00D9FF" stroke-width="0.3" opacity="0.04"/></pattern>
  </defs>
  <rect width="800" height="1100" fill="url(#bgGrad)"/><rect width="800" height="1100" fill="url(#grid)"/><rect width="800" height="1100" fill="url(#hex)"/>
  <!-- Header -->
