    <text x="0" y="22" text-anchor="middle" font-family="monospace" font-size="10" fill="#00FF88">◆◆</text>
    <text x="40" y="10" font-family="'Helvetica Neue', sans-serif" font-size="18" font-weight="bold" fill="#FFF">5 Flexible Engagement Models</text>
