    <text x="40" y="30" font-family="monospace" font-size="11" fill="#E0E0E0">HIPAA, FDA, SOC 2, ISO 27001 expertise</text>
    <text x="40" y="48" font-family="monospace" font-size="11" fill="#808080">Audit preparation and ongoing compliance management</text>
  </g>
