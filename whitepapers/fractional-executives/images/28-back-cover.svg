  <text x="400" y="860" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#FFF">Ready to Transform Your Organization?</text>
  <text x="400" y="895" text-anchor="middle" font-family="monospace" font-size="13" fill="#00D9FF">Schedule a complimentary strategic assessment</text>
  <text x="400" y="925" text-anchor="middle" font-family="monospace" font-size="12" fill="#808080">info@govaguard.com</text>
  <!-- Branding -->
