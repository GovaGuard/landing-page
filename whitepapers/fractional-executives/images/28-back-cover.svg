    <text x="0" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#00FF88">⏱</text>
    <text x="40" y="10" font-family="'Helvetica Neue', sans-serif" font-size="18" font-weight="bold" fill="#FFF">24-Hour Rapid Deployment</text>
    <text x="40" y="30" font-family="monospace" font-size="11" fill="#E0E0E0">Crisis response available in 24-48 hours</text>
    <text x="40" y="48" font-family="monospace" font-size="11" fill="#808080">Start strategic work within 1-2 weeks</text>
  </g>
  <!-- Takeaway 3 -->
  <g transform="translate(120, 430)">
    <circle cx="0" cy="15" r="22" fill="none" stroke="#00FF88" stroke-width="1.5"/>
    <text x="0" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#00FF88">★</text>
    <text x="40" y="10" font-family="'Helvetica Neue', sans-serif" font-size="18" font-weight="bold" fill="#FFF">C-Level Strategic Expertise</text>
    <text x="40" y="30" font-family="monospace" font-size="11" fill="#E0E0E0">10+ years average experience in MedTech/HealthTech</text>
    <text x="40" y="48" font-family="monospace" font-size="11" fill="#808080">Proven track record with 20+ companies</text>
  </g>
  <!-- Takeaway 4 -->
  <g transform="translate(120, 560)">
    <circle cx="0" cy="15" r="22" fill="none" stroke="#00FF88" stroke-width="1.5"/>
    <text x="0" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#00FF88">✓</text>
