  <text x="400" y="1040" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="2">STRATEGIC LEADERSHIP FOR MEDTECH &amp; HEALTHTECH</text>
  <!-- Corner decorations -->
  <path d="M20,20 H60 M20,20 V60" stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M780,20 H740 M780,20 V60" stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M20,1080 H60 M20,1080 V1040" stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M780,1080 H740 M780,1080 V1040" stroke="#00D9FF" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
