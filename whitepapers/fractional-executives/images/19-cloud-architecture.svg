  <rect x="420" y="270" width="100" height="30" rx="3" fill="#00FF88" fill-opacity="0.05" stroke="#00FF88" stroke-width="0.5"/>
  <text x="470" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">Cache (Redis)</text>

  <!-- Arrow -->
  <line x1="400" y1="315" x2="400" y2="345" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>

