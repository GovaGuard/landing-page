  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#00FF88" font-weight="bold">APPLICATION SERVERS (MULTI-AZ)</text>
  <rect x="180" y="270" width="100" height="30" rx="3" fill="#00FF88" fill-opacity="0.05" stroke="#00FF88" stroke-width="0.5"/>
  <text x="230" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">AZ-1</text>
  <rect x="300" y="270" width="100" height="30" rx="3" fill="#00FF88" fill-opacity="0.05" stroke="#00FF88" stroke-width="0.5"/>
