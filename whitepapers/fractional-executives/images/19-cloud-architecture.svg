  <text x="350" y="395" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">MongoDB 🔒</text>
  <text x="470" y="395" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">S3 Encrypted 🔒</text>
  <text x="580" y="395" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">Backup/DR</text>

  <!-- Security Panel (left) -->
  <rect x="20" y="175" width="110" height="240" rx="5" fill="#0A1628" stroke="#FF6B35" stroke-width="1"/>
  <text x="75" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#FF6B35" font-weight="bold">SECURITY</text>
  <text x="75" y="230" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">WAF</text>
  <text x="75" y="260" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">DDoS Protection</text>
  <text x="75" y="290" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">Network FW</text>
  <text x="75" y="320" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">VPN Gateway</text>

  <!-- Monitoring Panel (right) -->
  <rect x="670" y="175" width="110" height="240" rx="5" fill="#0A1628" stroke="#00FF88" stroke-width="1"/>
  <text x="725" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#00FF88" font-weight="bold">MONITORING</text>
  <text x="725" y="230" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">CloudWatch</text>
  <text x="725" y="260" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">SIEM</text>
  <text x="725" y="290" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">ELK Stack</text>
  <text x="725" y="320" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">APM</text>

  <rect x="0" y="522" width="800" height="28" fill="#000" fill-opacity="0.5"/>
  <text x="400" y="540" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="1">HIPAA-COMPLIANT · MULTI-AZ · ENCRYPTED · MONITORED</text>
