  <!-- Arrows down -->
  <line x1="190" y1="135" x2="300" y2="175" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="400" y1="135" x2="400" y2="175" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="610" y1="135" x2="500" y2="175" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>

  <!-- API Gateway / Load Balancer -->
  <rect x="250" y="175" width="300" height="35" rx="5" fill="#00D9FF" fill-opacity="0.08" stroke="#00D9FF" stroke-width="1.5"/>
