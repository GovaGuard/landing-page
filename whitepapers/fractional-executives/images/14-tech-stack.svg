  <rect x="130" y="375" width="540" height="65" rx="5" fill="#0A1628" stroke="#00D9FF" stroke-width="1.2"/>
  <text x="150" y="395" font-family="monospace" font-size="9" fill="#00D9FF" opacity="0.6">L1</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00D9FF">INFRASTRUCTURE</text>
  <text x="230" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">AWS/Azure/GCP</text>
  <text x="380" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">Kubernetes</text>
  <text x="520" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">Docker</text>

