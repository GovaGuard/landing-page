  <text x="400" y="175" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00FF88">APPLICATION LAYER</text>
  <text x="230" y="200" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">React</text>
