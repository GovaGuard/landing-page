  <text x="727" y="265" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF88" transform="rotate(-90,727,265)">MONITORING</text>
  <text x="727" y="400" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">Prometheus</text>
  <text x="727" y="415" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">ELK Stack</text>
  <text x="727" y="430" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">CloudWatch</text>

  <!-- Connecting arrows between layers -->
  <g opacity="0.3" stroke="#00D9FF" stroke-width="1">
    <line x1="400" y1="140" x2="400" y2="150"/><line x1="400" y1="215" x2="400" y2="225"/>
    <line x1="400" y1="290" x2="400" y2="300"/><line x1="400" y1="365" x2="400" y2="375"/>
  </g>

  <rect x="0" y="522" width="800" height="28" fill="#000" fill-opacity="0.5"/>
  <text x="400" y="540" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="1">5 LAYERS · DEVOPS PIPELINE · MONITORING &amp; OBSERVABILITY</text>
</svg>