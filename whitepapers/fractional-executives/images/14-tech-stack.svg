<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#0A1628"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.04"/></pattern>
  </defs>
  <rect width="800" height="550" fill="url(#bgGrad)"/><rect width="800" height="550" fill="url(#grid)"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">ARCHITECTURE BLUEPRINT</text>
  <text x="400" y="55" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#FFF">Modern MedTech Technology Stack</text>

  <!-- Layer 5: UX (top) -->
  <rect x="130" y="75" width="540" height="65" rx="5" fill="#0A1628" stroke="#00D9FF" stroke-width="1.2"/>
  <text x="150" y="95" font-family="monospace" font-size="9" fill="#00D9FF" opacity="0.6">L5</text>
