  <text x="550" y="200" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">REST APIs</text>

  <!-- Layer 3: Data -->
  <rect x="130" y="225" width="540" height="65" rx="5" fill="#0A1628" stroke="#00D9FF" stroke-width="1.2"/>
  <text x="150" y="245" font-family="monospace" font-size="9" fill="#00D9FF" opacity="0.6">L3</text>
  <text x="400" y="250" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00D9FF">DATA LAYER</text>
  <text x="230" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#E0E0E0" opacity="0.7">PostgreSQL</text>
