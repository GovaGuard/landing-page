  <rect x="30" y="75" width="85" height="365" rx="5" fill="#0A1628" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <text x="72" y="265" text-anchor="middle" font-family="monospace" font-size="9" fill="#00D9FF" transform="rotate(-90,72,265)">DEVOPS PIPELINE</text>
  <text x="72" y="400" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">CI/CD</text>
  <text x="72" y="415" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">GitOps</text>
  <text x="72" y="430" text-anchor="middle" font-family="monospace" font-size="7" fill="#808080">IaC</text>

