<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hexPattern" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 55,15 55,37 30,50 5,37 5,15" fill="none" stroke="#00D9FF" stroke-width="0.3" opacity="0.04"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#hexPattern)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">MARKET INTELLIGENCE</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">vCISO Market Growth Projection</text>

  <!-- CAGR badge -->
  <rect x="610" y="70" width="140" height="40" rx="5" fill="#000000" fill-opacity="0.6" stroke="#00FF88" stroke-width="1"/>
  <text x="680" y="87" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">CAGR</text>
  <text x="680" y="103" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FF88">11.7%</text>

  <g transform="translate(100, 100)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#808080" stroke-width="0.5" opacity="0.4"/>
    <!-- X-axis -->
    <line x1="0" y1="300" x2="600" y2="300" stroke="#808080" stroke-width="0.5" opacity="0.4"/>

    <!-- Y labels and grid -->
    <text x="-10" y="5" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">$4.0B</text>
    <line x1="0" y1="0" x2="600" y2="0" stroke="#808080" stroke-width="0.2" opacity="0.1"/>

    <text x="-10" y="80" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">$3.0B</text>
    <line x1="0" y1="75" x2="600" y2="75" stroke="#808080" stroke-width="0.2" opacity="0.1"/>

    <text x="-10" y="155" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">$2.0B</text>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#808080" stroke-width="0.2" opacity="0.1"/>

    <text x="-10" y="230" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">$1.0B</text>
    <line x1="0" y1="225" x2="600" y2="225" stroke="#808080" stroke-width="0.2" opacity="0.1"/>

    <!-- X labels -->
    <!-- 2024=x0, 2027=x200, 2030=x400, 2033=x600 -->
    <!-- $1.4B => y=300-1.4/4*300=300-105=195, $2.0B=>150, $2.8B=>90, $3.8B=>15 -->
    <text x="0" y="325" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#E0E0E0">2024</text>
    <text x="200" y="325" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#E0E0E0">2027</text>
    <text x="400" y="325" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#E0E0E0">2030</text>
    <text x="600" y="325" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#E0E0E0">2033</text>

    <!-- Vertical grid -->
    <line x1="200" y1="0" x2="200" y2="300" stroke="#808080" stroke-width="0.2" opacity="0.1"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#808080" stroke-width="0.2" opacity="0.1"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#808080" stroke-width="0.2" opacity="0.1"/>

    <!-- Area fill -->
    <path d="M0,195 C100,175 150,155 200,150 C300,130 350,105 400,90 C500,60 550,30 600,15 L600,300 L0,300 Z" fill="url(#areaGrad)"/>

    <!-- Trend line -->
    <path d="M0,195 C100,175 150,155 200,150 C300,130 350,105 400,90 C500,60 550,30 600,15" fill="none" stroke="#00D9FF" stroke-width="3" filter="url(#glowCyan)"/>

    <!-- Data points -->
    <circle cx="0" cy="195" r="6" fill="#00D9FF" filter="url(#dotGlow)"/>
    <circle cx="0" cy="195" r="3" fill="#FFFFFF"/>
    <text x="0" y="183" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00D9FF">$1.4B</text>

    <circle cx="200" cy="150" r="6" fill="#00D9FF" filter="url(#dotGlow)"/>
    <circle cx="200" cy="150" r="3" fill="#FFFFFF"/>
    <text x="200" y="138" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00D9FF">$2.0B</text>

    <circle cx="400" cy="90" r="6" fill="#00D9FF" filter="url(#dotGlow)"/>
    <circle cx="400" cy="90" r="3" fill="#FFFFFF"/>
    <text x="400" y="78" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00D9FF">$2.8B</text>

    <circle cx="600" cy="15" r="8" fill="#00FF88" filter="url(#dotGlow)"/>
    <circle cx="600" cy="15" r="4" fill="#FFFFFF"/>
    <text x="575" y="5" text-anchor="end" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#00FF88">$3.8B</text>
  </g>

  <!-- Bottom info bar -->
  <rect x="0" y="472" width="800" height="28" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1">SOURCE: MARKET RESEARCH · vCISO/FRACTIONAL SECURITY LEADERSHIP MARKET · CAGR 11.7%</text>
</svg>
