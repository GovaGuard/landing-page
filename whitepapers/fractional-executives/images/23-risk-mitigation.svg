  <line x1="680" y1="360" x2="510" y2="300" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <text x="510" y="295" font-size="14" fill="#FF0000" opacity="0.7">✕</text>
  <text x="640" y="370" font-family="monospace" font-size="8" fill="#FF6B35">REPUTATION</text>
