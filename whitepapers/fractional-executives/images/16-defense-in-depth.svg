<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#0A1628"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="radar" width="800" height="500" patternUnits="userSpaceOnUse">
      <line x1="400" y1="0" x2="400" y2="500" stroke="#808080" stroke-width="0.2" opacity="0.1"/>
      <line x1="0" y1="260" x2="800" y2="260" stroke="#808080" stroke-width="0.2" opacity="0.1"/>
      <line x1="150" y1="0" x2="650" y2="500" stroke="#808080" stroke-width="0.15" opacity="0.06"/>
      <line x1="650" y1="0" x2="150" y2="500" stroke="#808080" stroke-width="0.15" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/><rect width="800" height="500" fill="url(#radar)"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">TACTICAL DEFENSE</text>
  <text x="400" y="55" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#FFF">Defense-in-Depth Security Model</text>

  <!-- 7 concentric rings -->
  <circle cx="400" cy="280" r="190" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.25"/>
  <circle cx="400" cy="280" r="165" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>
  <circle cx="400" cy="280" r="140" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.35"/>
  <circle cx="400" cy="280" r="115" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <circle cx="400" cy="280" r="90" fill="none" stroke="#00D9FF" stroke-width="0.8" opacity="0.5"/>
  <circle cx="400" cy="280" r="65" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <circle cx="400" cy="280" r="38" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Ring labels -->
  <text x="400" y="82" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">1 PERIMETER</text>
  <text x="400" y="108" text-anchor="middle" font-family="monospace" font-size="8" fill="#909090">2 NETWORK</text>
  <text x="400" y="133" text-anchor="middle" font-family="monospace" font-size="8" fill="#A0A0A0">3 ENDPOINT</text>
  <text x="400" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#B0B0B0">4 APPLICATION</text>
  <text x="400" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#C0C0C0">5 DATA</text>
  <text x="400" y="212" text-anchor="middle" font-family="monospace" font-size="8" fill="#D0D0D0">6 IDENTITY</text>

  <!-- Center: Core Assets -->
  <text x="400" y="277" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00FF88">CORE</text>
  <text x="400" y="289" text-anchor="middle" font-family="monospace" font-size="7" fill="#00FF88">ASSETS</text>

  <!-- Right side labels -->
  <text x="620" y="130" font-family="monospace" font-size="8" fill="#808080">Firewall, IDS/IPS</text>
  <text x="600" y="160" font-family="monospace" font-size="8" fill="#808080">VPN, Segmentation</text>
  <text x="580" y="188" font-family="monospace" font-size="8" fill="#808080">EDR, Patching</text>
  <text x="560" y="215" font-family="monospace" font-size="8" fill="#808080">WAF, SAST/DAST</text>
  <text x="530" y="242" font-family="monospace" font-size="8" fill="#808080">Encryption, DLP</text>
  <text x="510" y="268" font-family="monospace" font-size="8" fill="#808080">MFA, SSO</text>

  <!-- Breach attempt arrow -->
  <line x1="120" y1="150" x2="270" y2="230" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <polygon points="270,226 278,234 266,234" fill="#FF6B35" opacity="0.6"/>
  <!-- Block indicators -->
  <text x="260" y="222" font-family="monospace" font-size="14" fill="#FF0000" opacity="0.7">✕</text>
  <text x="295" y="248" font-family="monospace" font-size="12" fill="#FF0000" opacity="0.5">✕</text>
  <text x="100" y="145" font-family="monospace" font-size="9" fill="#FF6B35" opacity="0.7">BREACH ATTEMPT</text>
  <text x="115" y="158" font-family="monospace" font-size="8" fill="#FF6B35" opacity="0.5">BLOCKED ✕</text>

  <rect x="0" y="472" width="800" height="28" fill="#000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="1">7 SECURITY LAYERS · PERIMETER → NETWORK → ENDPOINT → APP → DATA → IDENTITY → CORE</text>
</svg>