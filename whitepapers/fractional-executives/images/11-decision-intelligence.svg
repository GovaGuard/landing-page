<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000"/><stop offset="100%" stop-color="#0A1628"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.04"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/><rect width="800" height="500" fill="url(#grid)"/>
  <text x="400" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">STRATEGIC INTELLIGENCE</text>
  <text x="400" y="55" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#FFF">Executive Decision Intelligence</text>

  <!-- Central brain/network -->
  <circle cx="400" cy="250" r="55" fill="none" stroke="#00D9FF" stroke-width="2" filter="url(#bigGlow)" opacity="0.6"/>
  <circle cx="400" cy="250" r="40" fill="#00D9FF" fill-opacity="0.05" stroke="#00D9FF" stroke-width="1"/>
  <!-- Neural nodes inside -->
  <circle cx="385" cy="235" r="4" fill="#00D9FF" opacity="0.8"/><circle cx="415" cy="240" r="3" fill="#00D9FF" opacity="0.6"/>
  <circle cx="395" cy="260" r="3.5" fill="#00D9FF" opacity="0.7"/><circle cx="410" cy="255" r="2.5" fill="#00FF88" opacity="0.6"/>
  <circle cx="390" cy="245" r="2" fill="#FFF" opacity="0.5"/><circle cx="405" cy="265" r="3" fill="#00D9FF" opacity="0.5"/>
  <line x1="385" y1="235" x2="415" y2="240" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="395" y1="260" x2="410" y2="255" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="385" y1="235" x2="395" y2="260" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="415" y1="240" x2="405" y2="265" stroke="#00FF88" stroke-width="0.8" opacity="0.3"/>

  <!-- Pathway 1: Technology Strategy (left) -->
  <line x1="350" y1="230" x2="180" y2="150" stroke="#00FF88" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,3"/>
  <circle cx="265" cy="190" r="5" fill="#00FF88" opacity="0.4"/>
  <rect x="80" y="100" width="200" height="100" rx="8" fill="#0A1628" stroke="#00FF88" stroke-width="1" opacity="0.8"/>
  <text x="180" y="125" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00FF88">TECHNOLOGY STRATEGY</text>
  <line x1="100" y1="135" x2="260" y2="135" stroke="#00FF88" stroke-width="0.3" opacity="0.4"/>
  <text x="180" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Architecture Decisions</text>
  <text x="180" y="166" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Vendor Evaluations</text>
  <text x="180" y="179" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Innovation Roadmap</text>

  <!-- Pathway 2: Security (top) -->
  <line x1="400" y1="195" x2="400" y2="120" stroke="#00D9FF" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,3"/>
  <circle cx="400" cy="158" r="5" fill="#00D9FF" opacity="0.4"/>
  <rect x="300" y="70" width="200" height="50" rx="8" fill="#0A1628" stroke="#00D9FF" stroke-width="1" opacity="0.8"/>
  <text x="400" y="100" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00D9FF">SECURITY &amp; COMPLIANCE</text>

  <!-- Pathway 3: Business Growth (right) -->
  <line x1="450" y1="230" x2="620" y2="150" stroke="#00FF88" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,3"/>
  <circle cx="535" cy="190" r="5" fill="#00FF88" opacity="0.4"/>
  <rect x="520" y="100" width="200" height="100" rx="8" fill="#0A1628" stroke="#00FF88" stroke-width="1" opacity="0.8"/>
  <text x="620" y="125" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#00FF88">BUSINESS GROWTH</text>
  <line x1="540" y1="135" x2="700" y2="135" stroke="#00FF88" stroke-width="0.3" opacity="0.4"/>
  <text x="620" y="153" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Market Opportunity</text>
  <text x="620" y="166" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Resource Allocation</text>
  <text x="620" y="179" text-anchor="middle" font-family="monospace" font-size="8" fill="#E0E0E0" opacity="0.7">Strategic Partnerships</text>

  <!-- Feedback loops -->
  <path d="M180,200 Q180,350 300,310" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>
  <path d="M620,200 Q620,350 500,310" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>

  <!-- Data streams -->
  <g opacity="0.15">
    <circle cx="320" cy="210" r="2" fill="#00D9FF"/><circle cx="340" cy="220" r="1.5" fill="#00D9FF"/>
    <circle cx="460" cy="220" r="1.5" fill="#00FF88"/><circle cx="480" cy="210" r="2" fill="#00FF88"/>
  </g>

  <rect x="0" y="472" width="800" height="28" fill="#000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="1">AI-ENHANCED DECISION MAKING · TECHNOLOGY · SECURITY · GROWTH</text>
</svg>