<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">SERVICE MODELS</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">Flexible Engagement Models</text>

  <!-- Central hub -->
  <polygon points="400,220 430,237 430,268 400,285 370,268 370,237" fill="#0A1628" stroke="#00D9FF" stroke-width="2" filter="url(#glowCyan)"/>
  <polygon points="400,228 422,241 422,262 400,275 378,262 378,241" fill="#00D9FF" fill-opacity="0.08"/>
  <text x="400" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF" font-weight="bold">FLEXIBLE</text>
  <text x="400" y="262" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#00D9FF">ENGAGEMENT</text>

  <!-- Connecting lines -->
  <line x1="370" y1="240" x2="215" y2="140" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <line x1="430" y1="240" x2="585" y2="140" stroke="#00FF88" stroke-width="1" opacity="0.4"/>
  <line x1="365" y1="268" x2="175" y2="370" stroke="#00FF88" stroke-width="1" opacity="0.4"/>
  <line x1="435" y1="268" x2="625" y2="370" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="220" x2="400" y2="110" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>

  <!-- Node 1: Crisis Response (top center) -->
  <g transform="translate(400, 100)">
    <polygon points="0,-35 30,-18 30,13 0,30 -30,13 -30,-18" fill="#0A1628" stroke="#FF6B35" stroke-width="1.5"/>
    <polygon points="0,-28 24,-14 24,10 0,24 -24,10 -24,-14" fill="#FF6B35" fill-opacity="0.08"/>
    <!-- Lightning icon -->
    <path d="M-3,-15 L5,-15 L2,-3 L8,-3 L-3,15 L0,3 L-6,3 Z" fill="#FF6B35" opacity="0.9"/>
    <text x="0" y="48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">CRISIS RESPONSE</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#FF6B35">24–48 Hours</text>
  </g>

  <!-- Node 2: Part-Time (top left) -->
  <g transform="translate(180, 130)">
    <polygon points="0,-35 30,-18 30,13 0,30 -30,13 -30,-18" fill="#0A1628" stroke="#00D9FF" stroke-width="1.5"/>
    <polygon points="0,-28 24,-14 24,10 0,24 -24,10 -24,-14" fill="#00D9FF" fill-opacity="0.08"/>
    <!-- Clock icon -->
    <circle cx="0" cy="-3" r="10" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <line x1="0" y1="-3" x2="0" y2="-9" stroke="#00D9FF" stroke-width="1.5"/>
    <line x1="0" y1="-3" x2="5" y2="0" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="0" y="48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">PART-TIME</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00D9FF">10–20 hrs/week</text>
  </g>

  <!-- Node 3: Project-Based (top right) -->
  <g transform="translate(620, 130)">
    <polygon points="0,-35 30,-18 30,13 0,30 -30,13 -30,-18" fill="#0A1628" stroke="#00FF88" stroke-width="1.5"/>
    <polygon points="0,-28 24,-14 24,10 0,24 -24,10 -24,-14" fill="#00FF88" fill-opacity="0.08"/>
    <!-- Calendar icon -->
    <rect x="-9" y="-10" width="18" height="16" rx="2" fill="none" stroke="#00FF88" stroke-width="1.5"/>
    <line x1="-9" y1="-5" x2="9" y2="-5" stroke="#00FF88" stroke-width="1.5"/>
    <line x1="-4" y1="-13" x2="-4" y2="-8" stroke="#00FF88" stroke-width="1.5"/>
    <line x1="4" y1="-13" x2="4" y2="-8" stroke="#00FF88" stroke-width="1.5"/>
    <text x="0" y="48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">PROJECT-BASED</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00FF88">3–6 Months</text>
  </g>

  <!-- Node 4: Retainer (bottom left) -->
  <g transform="translate(145, 360)">
    <polygon points="0,-35 30,-18 30,13 0,30 -30,13 -30,-18" fill="#0A1628" stroke="#00FF88" stroke-width="1.5"/>
    <polygon points="0,-28 24,-14 24,10 0,24 -24,10 -24,-14" fill="#00FF88" fill-opacity="0.08"/>
    <!-- Infinity icon -->
    <path d="M-10,-2 C-10,-8 -4,-8 0,-2 C4,4 10,4 10,-2 C10,-8 4,-8 0,-2 C-4,4 -10,4 -10,-2" fill="none" stroke="#00FF88" stroke-width="1.8"/>
    <text x="0" y="48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">RETAINER</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00FF88">Ongoing Monthly</text>
  </g>

  <!-- Node 5: Embedded (bottom right) -->
  <g transform="translate(655, 360)">
    <polygon points="0,-35 30,-18 30,13 0,30 -30,13 -30,-18" fill="#0A1628" stroke="#00D9FF" stroke-width="1.5"/>
    <polygon points="0,-28 24,-14 24,10 0,24 -24,10 -24,-14" fill="#00D9FF" fill-opacity="0.08"/>
    <!-- People icon -->
    <circle cx="-6" cy="-8" r="4" fill="none" stroke="#00D9FF" stroke-width="1.3"/>
    <path d="M-14,4 Q-14,-2 -6,-2 Q2,-2 2,4" fill="none" stroke="#00D9FF" stroke-width="1.3"/>
    <circle cx="6" cy="-8" r="4" fill="none" stroke="#00D9FF" stroke-width="1.3"/>
    <path d="M-2,4 Q-2,-2 6,-2 Q14,-2 14,4" fill="none" stroke="#00D9FF" stroke-width="1.3"/>
    <text x="0" y="48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">EMBEDDED</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00D9FF">30–40 hrs/week</text>
  </g>

  <!-- Connection dots on lines -->
  <circle cx="290" cy="190" r="2" fill="#00D9FF" opacity="0.5"/>
  <circle cx="510" cy="190" r="2" fill="#00FF88" opacity="0.5"/>
  <circle cx="270" cy="320" r="2" fill="#00FF88" opacity="0.5"/>
  <circle cx="530" cy="320" r="2" fill="#00D9FF" opacity="0.5"/>
  <circle cx="400" cy="165" r="2" fill="#00D9FF" opacity="0.5"/>

  <!-- Bottom info bar -->
  <rect x="0" y="472" width="800" height="28" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1">BUILD YOUR SOLUTION · SCALE UP OR DOWN · NO LONG-TERM COMMITMENT</text>
</svg>
