<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00D9FF" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">FINANCIAL PROJECTION</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ROI Realization Timeline</text>

  <!-- Chart area: translate to chart origin -->
  <g transform="translate(100, 80)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#808080" stroke-width="0.5" opacity="0.4"/>
    <!-- X-axis -->
    <line x1="0" y1="220" x2="620" y2="220" stroke="#808080" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,4"/>

    <!-- Y grid lines and labels -->
    <text x="-10" y="8" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">+300%</text>
    <line x1="0" y1="4" x2="620" y2="4" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <text x="-10" y="63" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">+225%</text>
    <line x1="0" y1="59" x2="620" y2="59" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <text x="-10" y="118" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">+150%</text>
    <line x1="0" y1="114" x2="620" y2="114" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <text x="-10" y="173" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">+75%</text>
    <line x1="0" y1="169" x2="620" y2="169" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <text x="-10" y="224" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#00FF88">0%</text>

    <text x="-10" y="280" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">-75%</text>
    <line x1="0" y1="276" x2="620" y2="276" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <text x="-10" y="340" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#808080">-100%</text>

    <!-- X-axis labels -->
    <text x="0" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">M0</text>
    <text x="155" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">M3</text>
    <text x="310" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">M6</text>
    <text x="465" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">M9</text>
    <text x="620" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">M12</text>

    <!-- Vertical grid lines -->
    <line x1="155" y1="0" x2="155" y2="340" stroke="#808080" stroke-width="0.2" opacity="0.12"/>
    <line x1="310" y1="0" x2="310" y2="340" stroke="#808080" stroke-width="0.2" opacity="0.12"/>
    <line x1="465" y1="0" x2="465" y2="340" stroke="#808080" stroke-width="0.2" opacity="0.12"/>
    <line x1="620" y1="0" x2="620" y2="340" stroke="#808080" stroke-width="0.2" opacity="0.12"/>

    <!-- Area fill under curve -->
    <!-- Points: M0=-100%(340), M3=0%(220), M6=+75%(169-55=114... let me recalc)
         Y scale: 0% at y=220, +300% at y=4, -100% at y=340
         Per percent: (340-4)/400 = 0.84 per %
         -100% => y=340, 0% => y=220, +75% => y=220-75*0.555=220-41=179... 
         Let me use: range 340 to 4 for -100 to +300, total 336px for 400%
         Per % = 0.84
         -100 => 340, 0 => 340-100*0.84=256... 
         
         Simpler: y=220 is 0%. Each 1% = (220-4)/300 = 0.72px up, or (340-220)/100=1.2px down
         -100% => 220+100*1.2=340 ✓
         0% => 220 ✓  
         +75% => 220-75*0.72=166
         +283% => 220-283*0.72=16
    -->
    <path d="M0,340 C50,340 100,260 155,220 C210,180 260,170 310,166 C380,155 500,80 620,16 L620,340 Z" fill="url(#areaFill)"/>

    <!-- Main curve line -->
    <path d="M0,340 C50,340 100,260 155,220 C210,180 260,170 310,166 C380,155 500,80 620,16" fill="none" stroke="#00D9FF" stroke-width="3" filter="url(#glowCyan)"/>

    <!-- Data points -->
    <!-- Month 0: -100% -->
    <circle cx="0" cy="340" r="5" fill="#00D9FF" filter="url(#dotGlow)"/>

    <!-- Month 3: 0% (break-even) -->
    <circle cx="155" cy="220" r="7" fill="#00FF88" filter="url(#glowGreen)"/>
    <circle cx="155" cy="220" r="3" fill="#FFFFFF"/>

    <!-- Month 6: +75% -->
    <circle cx="310" cy="166" r="5" fill="#00D9FF" filter="url(#dotGlow)"/>

    <!-- Month 12: +283% -->
    <circle cx="620" cy="16" r="7" fill="#00D9FF" filter="url(#dotGlow)"/>
    <circle cx="620" cy="16" r="3" fill="#FFFFFF"/>

    <!-- Break-even annotation -->
    <line x1="155" y1="220" x2="155" y2="340" stroke="#00FF88" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <rect x="105" y="195" width="100" height="18" rx="3" fill="#000000" fill-opacity="0.8" stroke="#00FF88" stroke-width="0.8"/>
    <text x="155" y="208" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00FF88">BREAK-EVEN</text>

    <!-- Month 12 annotation -->
    <rect x="555" y="-8" width="80" height="18" rx="3" fill="#000000" fill-opacity="0.8" stroke="#00D9FF" stroke-width="0.8"/>
    <text x="595" y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00D9FF">+283%</text>

    <!-- +75% annotation -->
    <text x="325" y="158" font-family="'Courier New', monospace" font-size="10" fill="#00D9FF" opacity="0.8">+75%</text>

    <!-- -100% annotation -->
    <text x="15" y="336" font-family="'Courier New', monospace" font-size="10" fill="#FF6B35" opacity="0.8">-100%</text>
  </g>

  <!-- Bottom info bar -->
  <rect x="0" y="472" width="800" height="28" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1">BREAK-EVEN: 3–6 MONTHS · PROJECTED ROI AT 12 MONTHS: +283%</text>
</svg>
