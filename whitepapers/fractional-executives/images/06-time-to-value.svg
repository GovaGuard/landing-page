<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00CC66"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#CC5500"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00D9FF" stroke-width="0.2" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="4" opacity="0.7">DEPLOYMENT ANALYSIS</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="1">Time to Value Comparison</text>

  <g transform="translate(80, 90)">
    <!-- Time scale header -->
    <text x="160" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">0</text>
    <text x="230" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">30</text>
    <text x="305" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">60</text>
    <text x="380" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">90</text>
    <text x="453" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">120</text>
    <text x="527" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">150</text>
    <text x="600" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">180</text>
    <text x="630" y="20" font-family="'Courier New', monospace" font-size="10" fill="#808080">days</text>

    <!-- Time scale vertical markers -->
    <line x1="160" y1="25" x2="160" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="235" y1="25" x2="235" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="310" y1="25" x2="310" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="385" y1="25" x2="385" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="460" y1="25" x2="460" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="535" y1="25" x2="535" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>
    <line x1="610" y1="25" x2="610" y2="310" stroke="#808080" stroke-width="0.3" opacity="0.2"/>

    <!-- FRACTIONAL EXECUTIVE TRACK -->
    <text x="0" y="75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#00FF88">Fractional</text>
    <text x="0" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#00FF88">Executive</text>

    <!-- Green bar - just 1 day, very short -->
    <rect x="160" y="65" width="8" height="35" rx="3" fill="url(#greenBar)" filter="url(#glowGreen)"/>
    <!-- Checkmark -->
    <circle cx="180" cy="82" r="10" fill="#000000" fill-opacity="0.6" stroke="#00FF88" stroke-width="1.5"/>
    <path d="M175,82 L178,86 L186,77" stroke="#00FF88" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Label -->
    <rect x="195" y="70" width="90" height="24" rx="3" fill="#000000" fill-opacity="0.7" stroke="#00FF88" stroke-width="0.8"/>
    <text x="240" y="87" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00FF88">24 HOURS</text>

    <!-- Separator -->
    <line x1="0" y1="135" x2="640" y2="135" stroke="#808080" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4"/>

    <!-- FULL-TIME HIRE TRACK -->
    <text x="0" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6B35">Full-Time</text>
    <text x="0" y="197" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6B35">Hire</text>

    <!-- Orange bar - spans full 180 days -->
    <rect x="160" y="168" width="450" height="35" rx="3" fill="url(#orangeBar)" filter="url(#glowOrange)" opacity="0.8"/>

    <!-- Milestone segments -->
    <!-- Job Posting: day 0-30 -->
    <rect x="160" y="168" width="75" height="35" rx="3" fill="#FF6B35" fill-opacity="0.3" stroke="#FF8C55" stroke-width="0.5"/>
    <text x="197" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">JOB POST</text>

    <!-- Interviews: day 30-60 -->
    <rect x="235" y="168" width="75" height="35" fill="#FF6B35" fill-opacity="0.2" stroke="#FF8C55" stroke-width="0.5"/>
    <text x="272" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">INTERVIEWS</text>

    <!-- Offer: day 60-90 -->
    <rect x="310" y="168" width="75" height="35" fill="#FF6B35" fill-opacity="0.15" stroke="#FF8C55" stroke-width="0.5"/>
    <text x="347" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">OFFER</text>

    <!-- Notice Period: day 90-120 -->
    <rect x="385" y="168" width="75" height="35" fill="#FF6B35" fill-opacity="0.1" stroke="#FF8C55" stroke-width="0.5"/>
    <text x="422" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">NOTICE</text>

    <!-- Onboarding: day 120-180 -->
    <rect x="460" y="168" width="150" height="35" fill="#FF6B35" fill-opacity="0.08" stroke="#FF8C55" stroke-width="0.5"/>
    <text x="535" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FFFFFF">ONBOARDING</text>

    <!-- Label -->
    <rect x="395" y="215" width="130" height="24" rx="3" fill="#000000" fill-opacity="0.7" stroke="#FF6B35" stroke-width="0.8"/>
    <text x="460" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF6B35">90–180 DAYS</text>

    <!-- Speed comparison callout -->
    <rect x="180" y="265" width="280" height="40" rx="6" fill="#000000" fill-opacity="0.7" stroke="#00FF88" stroke-width="1.2"/>
    <text x="320" y="283" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080">SPEED ADVANTAGE</text>
    <text x="320" y="298" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FF88">90–180x FASTER DEPLOYMENT</text>
  </g>

  <!-- Bottom info bar -->
  <rect x="0" y="472" width="800" height="28" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#808080" letter-spacing="1">FRACTIONAL: 24H ACTIVATION · FULL-TIME: 3–6 MONTH HIRING PROCESS</text>
</svg>
