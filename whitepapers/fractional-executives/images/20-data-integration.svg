  <text x="200" y="363" font-family="monospace" font-size="9" fill="#FF6B35" opacity="0.6">🔒</text>

  <rect x="0" y="472" width="800" height="28" fill="#000" fill-opacity="0.5"/>
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="10" fill="#808080" letter-spacing="1">HL7 v2 · FHIR R4 · DICOM · ENCRYPTED CONNECTIONS · BIDIRECTIONAL DATA FLOW</text>
