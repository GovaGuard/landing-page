  <text x="680" y="258" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">HL7 v2 (RXO)</text>
  <line x1="610" y1="245" x2="445" y2="260" stroke="#00D9FF" stroke-width="1" opacity="0.5"/>
  <text x="590" y="238" font-family="monospace" font-size="9" fill="#FF6B35" opacity="0.6">🔒</text>

