  <text x="570" y="365" font-family="monospace" font-size="9" fill="#FF6B35" opacity="0.6">🔒</text>

  <!-- System 6: Analytics (bottom-left) -->
  <rect x="100" y="370" width="140" height="50" rx="5" fill="#0A1628" stroke="#00FF88" stroke-width="1"/>
  <text x="170" y="395" text-anchor="middle" font-family="monospace" font-size="10" fill="#00FF88" font-weight="bold">Analytics</text>
  <text x="170" y="408" text-anchor="middle" font-family="monospace" font-size="8" fill="#808080">FHIR Bulk Export</text>
