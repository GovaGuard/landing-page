services:
  # GovaGuard Application
  govaguard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: govaguard-app
    restart: unless-stopped
    environment:
      # Empty values allowed so fresh clones can run every compose command;
      # the app logs a warning at startup if these are unset.
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}
    networks:
      - govaguard-network
    expose:
      - "8080"

  # Envoy Proxy
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: govaguard-envoy
    restart: unless-stopped
    environment:
      # Run as root: certbot's live/ and archive/ dirs are 0700 root, unreadable to the default envoy user
      - ENVOY_UID=0
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${ADMIN_PORT:-9901}:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Mount the whole tree: live/ only holds symlinks into archive/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - govaguard-network
    depends_on:
      - govaguard
    command: ["-c", "/etc/envoy/envoy.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9901/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  govaguard-network:
    driver: bridge
